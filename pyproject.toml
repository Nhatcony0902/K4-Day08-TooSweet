[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "k4-day08-rag-pipeline"
version = "0.1.0"
description = "Day 8 lab for building and evaluating a RAG pipeline"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "python-dotenv>=1.0.0,<2",
    "requests>=2.31.0,<3",
    "streamlit>=1.35.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0"]
providers = [
    "anthropic>=0.40.0,<2",
    "google-genai>=1.0.0,<3",
    "openai>=2.45.0,<3",
]
vector = ["chromadb>=0.5.0,<2"]
local-embedding = ["sentence-transformers>=2.2.0,<7"]
conversion = ["markitdown[pdf]>=0.1.0,<0.2"]
evaluation = ["ragas==0.4.3", "datasets>=4.0.0,<6"]
crawl = ["crawl4ai==0.9.3"]

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
